name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # deliberately no `push` — this job commits, and
                              # a push trigger would re-run it on its own commit

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No personal access token needed: the built-in GITHUB_TOKEN returns the
      # same numbers, because every repository the script counts is public.
      - name: draw the graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit only on change
        run: |
          FILES="stats-dark.svg stats-light.svg \
                 streak-dark.svg streak-light.svg \
                 langs-dark.svg langs-light.svg \
                 year-dark.svg year-light.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
